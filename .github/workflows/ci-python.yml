name: ci-python

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pythonnet pandas numpy pytest
          python build_dlls.py

      - name: Test Python package
        run: |
          python -m pytest tests_python/ -v --tb=short

      - name: Run examples
        run: |
          python examples/basic_indicator.py
          python examples/multi_engine_pipeline.py
          python examples/pandas_integration.py
